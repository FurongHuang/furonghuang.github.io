    kicker: Connect perception, language, and generation
    question: How can a model reason across modalities instead of merely recognizing each one?
    intro: We build diagnostic benchmarks, structured datasets, and learning objectives that expose whether multimodal systems truly connect evidence across images, video, language, and generation.
    methods:
      - Cross-modal reasoning
      - Sequential visual understanding
      - Diagnostic evaluation
      - Interleaved vision-language data
    projects:
      - id: rover
        area: Multimodal learning
        title: ROVER
        summary: A benchmark for reciprocal reasoning between understanding and generation across image, video, audio, and 3D modalities.
