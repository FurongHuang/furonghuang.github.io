pillars:
  - id: world-models
    number: "01"
    title: World models
    shortTitle: World models
    subtitle: Learn what can happen
    description: Represent physical and digital environments so agents can predict consequences, transfer across embodiments, and plan beyond direct experience.
    href: /research/#world-models
    topics:
      - label: Embodied AI
        href: /research/embodied-ai/
      - label: Multimodal learning
        href: /research/multimodal-learning/
      - label: Sequential decision-making
        href: /research/sequential-decision-making/
    featuredArea:
      title: Embodied AI
      description: World models become tangible when agents must understand space, bodies, state, and consequences. Explore representative systems, videos, code, and papers.
      href: /research/embodied-ai/
