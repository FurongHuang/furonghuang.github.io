      imageAlt: Human and robot interaction traces modeled by μ0
      featuredProjectId: mu0
  - id: reasoning-control
    number: "02"
    title: Reasoning control
    shortTitle: Reasoning control
    subtitle: Decide how to think
    description: "Treat inference as a control problem: allocate computation, collaboration, evidence, and verification where they improve decisions most."
    href: /research/#reasoning-control
    topics:
      - label: AI Agents
        href: /research/ai-agents/
      - label: Test-time compute
        href: /research/test-time-compute/
      - label: Agentic workflows
        href: /research/agentic-workflows/
    featuredArea:
      title: AI Agents
      description: Agents turn reasoning into purposeful behavior by planning, using tools, verifying progress, and recovering when an initial strategy fails.
      href: /research/ai-agents/
      image: /assets/projects/agentic-critical-training.png
      imageAlt: Agentic Critical Training system overview
      featuredProjectId: agentic-critical-training
  - id: self-improvement
    number: "03"
    title: Trustworthy self-improvement
    shortTitle: Trustworthy AI
    subtitle: Learn from failure
    description: Build closed-loop systems that discover failures, intervene before they unfold, and convert uncertainty and hard examples into safer behavior.
    href: /research/#self-improvement
    topics:
      - label: AI Safety
        href: /research/ai-safety/
      - label: Alignment
        href: /research/alignment/
      - label: Robust learning
        href: /research/robust-learning/
