<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Escaping a saddle point with stochastic gradients</title>
  <desc id="desc">A contour landscape with an optimization path moving away from a saddle region.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f4ea"/>
      <stop offset="1" stop-color="#edf8f6"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e46f51"/>
      <stop offset="1" stop-color="#159b97"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#159b97"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0d2f46" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="40" fill="url(#bg)"/>
  <g fill="none" stroke-linecap="round" opacity=".86">
    <path d="M92 111 C300 37 454 71 594 225 C728 372 884 419 1107 342" stroke="#b9ddd8" stroke-width="3"/>
    <path d="M73 180 C286 85 456 110 586 249 C719 392 885 466 1130 389" stroke="#83c8c0" stroke-width="5"/>
    <path d="M62 266 C264 151 444 157 573 278 C709 406 893 513 1140 452" stroke="#44ada6" stroke-width="7"/>
    <path d="M75 557 C299 626 463 575 588 424 C710 276 888 217 1124 308" stroke="#f1c2b5" stroke-width="3"/>
    <path d="M68 492 C286 577 459 530 585 397 C715 260 886 169 1126 253" stroke="#eba38f" stroke-width="5"/>
    <path d="M81 416 C285 513 457 477 581 369 C719 250 878 118 1108 196" stroke="#e67c60" stroke-width="7"/>
  </g>
  <g filter="url(#shadow)">
    <ellipse cx="585" cy="334" rx="90" ry="45" fill="#fff" opacity=".9"/>
    <path d="M513 334 C545 288 624 288 657 334 C624 380 546 380 513 334Z" fill="#fff4ef" stroke="#e46f51" stroke-width="4"/>
    <path d="M585 288 C549 309 549 359 585 380 C621 359 621 309 585 288Z" fill="#eaf8f6" stroke="#159b97" stroke-width="4"/>
  </g>
  <path d="M388 449 C435 417 472 400 510 381 C537 367 556 352 569 337 C591 312 621 290 661 263 C724 221 794 183 899 157" fill="none" stroke="url(#path)" stroke-width="13" marker-end="url(#arrow)"/>
  <g fill="#fff" stroke-width="7">
    <circle cx="388" cy="449" r="16" stroke="#e46f51"/>
    <circle cx="472" cy="400" r="14" stroke="#d87f68"/>
    <circle cx="537" cy="367" r="13" stroke="#a78e79"/>
    <circle cx="591" cy="312" r="13" stroke="#6d9990"/>
    <circle cx="661" cy="263" r="14" stroke="#3aa29d"/>
    <circle cx="794" cy="183" r="16" stroke="#159b97"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#15324a">
    <text x="86" y="88" font-size="30" font-weight="700" letter-spacing="2">ONLINE STOCHASTIC GRADIENT</text>
    <text x="86" y="126" font-size="22" fill="#50708a">A noisy trajectory escapes an unstable saddle region</text>
    <text x="515" y="438" font-size="22" font-weight="700">saddle region</text>
  </g>
</svg>
